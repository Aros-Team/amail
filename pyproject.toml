[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/amail"]

[project]
name = "amail"
version = "1.2.1"
description = "Aros mail system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.141.1",
    "starlette==1.1.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv==1.0.1",
    "resend==2.23.0",
    "structlog==24.4.0",
    "tenacity==8.3.0",
    "uvicorn==0.30.6",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "ANN",  # mandatory type hints
    "D",    # mandatory docstrings
]
ignore = [
    "ANN101",  # self (deprecated, inferred by type checkers)
    "ANN102",  # cls (deprecated, inferred by type checkers)
    "D105",    # magic method docstrings not required
    "D107",    # __init__ covered by the class docstring
    "D203",    # conflicts with D211 and the formatter
    "D212",    # conflicts with D213
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100"]  # test modules don't need module docstrings
