[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[project]
name = "amail"
version = "0.1.0"
description = "Aros mail system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.115.0",
    "jinja2==3.1.4",
    "pydantic[email]==2.8.2",
    "pydantic-settings>=2.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "python-dotenv==1.0.1",
    "resend==2.23.0",
    "ruff==0.6.9",
    "structlog==24.4.0",
    "tenacity==8.3.0",
    "uvicorn==0.30.6",
]
