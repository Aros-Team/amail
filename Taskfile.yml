version: "3"

vars:
  IMG: amail:latest

tasks:
  run:
    desc: Levanta el servidor FastAPI con reload
    cmds:
      - uv run fastapi dev src/amail/main.py

  run:cloud:
    desc: >
      Levanta el servidor FastAPI en segundo plano y expone el puerto con un
      tunnel publico via npx nport (Cloudflare), util para probar webhooks.
      Uso: `task run:cloud` o `task run:cloud NSUB=amail-webhook`.
    vars:
      PORT: "8000"
      NSUB: ""
    cmds:
      - 'uv run fastapi dev src/amail/main.py --port {{.PORT}} 2>&1 &'
      - sleep 4
      - 'npx --yes nport {{.PORT}} {{if .NSUB}}-s {{.NSUB}}{{end}}'

  test:
    desc: Ejecuta pytest
    cmds:
      - uv run pytest

  format:
    desc: Verifica lint y formato con ruff (sin modificar)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  format:fix:
    desc: Formatea el codigo con ruff
    cmds:
      - uv run ruff format .

  clean:
    desc: Limpia caches y pycache
    cmds:
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - rm -rf .ruff_cache .pytest_cache

  build:
    desc: Construye la imagen Docker
    cmds:
      - docker build -t {{.IMG}} .
