# Amail inbound routing contract.
#
# Copy this file to src/amail/config/routes.yaml for local development, OR paste its
# full content into the AMAIL_ROUTES environment variable / secret for
# serverless deployments. AMAIL_ROUTES_FILE may instead point to a YAML file.
#
# Source precedence: AMAIL_ROUTES (text) -> AMAIL_ROUTES_FILE (path) ->
# src/amail/config/routes.yaml (dev file).

# Domain used as the default sender (noreply@{domain}) and by /health/email.
domain: example.com

# Each inbound recipient accepts email and maps it to one or more forward
# targets. Email to an address not in this list is ignored.
inbound:
  # Single forward target.
  - to: support
    forwards:
      - ops@team.example.com

  # Multiple forward targets (email is sent to the union).
  - to: team
    forwards:
      - ops@team.example.com
      - backup.team@example.com

# Optional fallback used when no inbound rule matches a received email.
# Leave `forwards` empty to ignore un-routed mail.
fallback:
  forwards: []