{% extends "base.html" %}

{% block content %}
{% if heading %}
<h2 style="color:#333;font-size:18px;margin-top:0">{{ heading }}</h2>
{% endif %}
<p style="color:#333;font-size:16px;border-left:4px solid {{ brand_color | default('#1a73e8') }};padding-left:15px;line-height:1.5;margin:0">
  {{ message }}
</p>
{% if details %}
<ul style="color:#555;font-size:14px;margin-top:16px;padding-left:20px">
  {% for key, value in details.items() %}
  <li><strong>{{ key }}:</strong> {{ value }}</li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
